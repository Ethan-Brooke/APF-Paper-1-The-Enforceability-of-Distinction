[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apf-paper1"
version = "5.2"
description = "The Enforceability of Distinction — executable mathematical appendix"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
  {name = "Ethan Brooke", email = "brooke.ethan@gmail.com"}
]
keywords = ["quantum foundations", "finite enforcement", "Sep/IJC dichotomy", "noncommutative continuation structure", "irreducible joint constraint", "Admissible Possibility Space", "PLEC", "argument-first companion paper", "Hilbert representation preview", "Born rule preview", "Tsirelson bound preview", "structural realism"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/Ethan-Brooke/APF-Paper-1-The-Enforceability-of-Distinction"
"Bug Tracker" = "https://github.com/Ethan-Brooke/APF-Paper-1-The-Enforceability-of-Distinction/issues"
"Zenodo" = "https://doi.org/10.5281/zenodo.18604678"

[tool.setuptools.packages.find]
include = ["apf*"]
